spring.application.name=school-admin

# PostgreSQL Database Configuration
# IMPORTANT: These are placeholder values. Create application-local.properties with your actual credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/school_admin_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL init — disabled; seeding is handled by DataInitializer.java
spring.sql.init.mode=never

# JWT - IMPORTANT: Set this in application-local.properties or via environment variable
app.jwt.secret=${JWT_SECRET:your-secret-key-here}
app.jwt.expiration=86400000

# Server
server.port=8080

# Logging
logging.level.com.school.admin=INFO
